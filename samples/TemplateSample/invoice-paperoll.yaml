# Factura formato paperoll / POS — rollo de 80 mm (226.77 pt), papel continuo.
# page.size: roll80 → sin saltos de página: la altura final la decide el contenido (un ticket largo
# sale en una sola tira y se corta al final). Imprímelo con NetReporter.EscPos o expórtalo a PDF.
# Márgenes de 4 mm = área imprimible de 72 mm (576 puntos a 203 dpi): ContentWidth = 204 pt y las
# columnas de la tabla suman 204 exactos. Fuente monoespaciada (Courier) para alinear montos.
# Un reporte tiene UN ReportHeader y UN ReportFooter (el motor ignora los demás): aquí van completos.

name: FacturaPaperoll
title: "Ticket {{ $.numero }}"
fileName: "ticket-{{ $.numero }}"

page:
  size: roll80         # papel continuo de 80 mm: sin saltos de página, la altura la decide el contenido
  margins:
    horizontal: 4mm    # área imprimible de 72 mm (576 puntos a 203 dpi) → contenido de 204 pt
    vertical: 4mm

culture: es-HN

styles:
  Default:
    fontFamily: Courier
    fontSize: 9
    foreground: "#000000"
  Center:
    basedOn: Default
    align: center
  Right:
    basedOn: Default
    align: right
  Bold:
    basedOn: Default
    bold: true
  BoldCenter:
    basedOn: Bold
    align: center
  BoldRight:
    basedOn: Bold
    align: right
  Title:
    basedOn: Default
    fontSize: 12
    bold: true
    align: center
  Total:
    basedOn: Default
    fontSize: 11
    bold: true
  TotalRight:
    basedOn: Total
    align: right
  Small:               # el CAI no cabe en 204 pt a 9 pt; a 7 pt sí (el texto que desborda se recorta por palabra)
    basedOn: Default
    fontSize: 7
  TableHeader:
    basedOn: Default
    bold: true
    padding: { horizontal: 1, vertical: 1 }
    border:
      bottom: { thickness: 0.5, color: "#000000" }
  TableRow:
    basedOn: Default
    padding: { horizontal: 1, vertical: 1 }

bands:
  # Emisor + título + cliente
  - kind: ReportHeader
    height: 154
    elements:
      - type: text
        bounds: { x: 0, y: 0, width: 204, height: 14 }
        content: "{{ $.emisor.nombre }}"
        style: BoldCenter
      - type: text
        bounds: { x: 0, y: 14, width: 204, height: 11 }
        content: "RTN: {{ $.emisor.rtn }}"
        style: Center
      - type: text
        bounds: { x: 0, y: 25, width: 204, height: 11 }
        content: "{{ $.emisor.direccion }}"
        style: Center
      - type: text
        bounds: { x: 0, y: 36, width: 204, height: 11 }
        content: "Tel: {{ $.emisor.telefono }}"
        style: Center

      - type: line
        bounds: { x: 0, y: 50, width: 204, height: 0 }
        color: "#000000"
        thickness: 0.5

      - type: text
        bounds: { x: 0, y: 56, width: 204, height: 14 }
        content: "FACTURA"
        style: Title
      - type: text
        bounds: { x: 0, y: 72, width: 204, height: 11 }
        content: "No. {{ $.numero }}"
        style: Center
      - type: text
        bounds: { x: 0, y: 84, width: 204, height: 11 }
        content: "Fecha: {{ $.fecha }}"
        style: Center

      - type: line
        bounds: { x: 0, y: 98, width: 204, height: 0 }
        color: "#000000"
        thickness: 0.5

      - type: text
        bounds: { x: 0, y: 104, width: 204, height: 11 }
        content: "Cliente: {{ $.cliente.nombre }}"
        style: Default
      - type: text
        bounds: { x: 0, y: 116, width: 204, height: 11 }
        content: "RTN: {{ $.cliente.rtn }}"
        style: Default
      - type: text
        bounds: { x: 0, y: 128, width: 204, height: 11 }
        content: "{{ $.cliente.direccion }}"
        style: Default
      - type: line
        bounds: { x: 0, y: 144, width: 204, height: 0 }
        color: "#000000"
        thickness: 0.5

  - kind: Detail
    height: 0
    elements:
      - type: table
        bounds: { x: 0, y: 0, width: 204, height: 0 }
        rows: "$.lineas"
        headerStyle: TableHeader
        rowStyle: TableRow
        headerMode: RepeatOnPageBreak
        headerHeight: 14
        rowHeight: 12
        columns:
          - { header: "Cod",    binding: "$.codigo",      width: 40,  align: left  }
          - { header: "Cant",   binding: "$.cantidad",    width: 30,  align: right }
          - { header: "Desc",   binding: "$.descripcion", width: 74,  align: left  }
          - { header: "Total",  binding: "$.total",       width: 60,  format: "N2", align: right }

  # Totales + CAI + despedida
  - kind: ReportFooter
    height: 120
    elements:
      - type: line
        bounds: { x: 0, y: 2, width: 204, height: 0 }
        color: "#000000"
        thickness: 0.5
      - type: text
        bounds: { x: 0, y: 6, width: 110, height: 12 }
        content: "Subtotal:"
        style: Default
      - type: text
        bounds: { x: 104, y: 6, width: 100, height: 12 }
        content: "{{ $.subtotal }}"
        style: Right
      - type: text
        bounds: { x: 0, y: 20, width: 110, height: 12 }
        content: "ISV 15%:"
        style: Default
      - type: text
        bounds: { x: 104, y: 20, width: 100, height: 12 }
        content: "{{ $.isv }}"
        style: Right

      - type: line
        bounds: { x: 0, y: 36, width: 204, height: 0 }
        color: "#000000"
        thickness: 1

      - type: text
        bounds: { x: 0, y: 40, width: 110, height: 14 }
        content: "TOTAL:"
        style: Total
      - type: text
        bounds: { x: 104, y: 40, width: 100, height: 14 }
        content: "{{ $.total }}"
        style: TotalRight

      - type: line
        bounds: { x: 0, y: 60, width: 204, height: 0 }
        color: "#000000"
        thickness: 0.5

      - type: text
        bounds: { x: 0, y: 64, width: 204, height: 10 }
        content: "CAI: {{ $.cai }}"
        style: Small
      - type: text
        bounds: { x: 0, y: 74, width: 204, height: 10 }
        content: "Vence: {{ $.vence }}"
        style: Default

      - type: line
        bounds: { x: 0, y: 92, width: 204, height: 0 }
        color: "#000000"
        thickness: 0.5
      - type: text
        bounds: { x: 0, y: 98, width: 204, height: 12 }
        content: "Gracias por su compra"
        style: BoldCenter
