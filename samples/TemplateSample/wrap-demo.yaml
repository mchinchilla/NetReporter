# Demo de word wrap + auto-height en TextElement Y en banda.
# La banda 'AutoBand' tiene height: 0 + autoHeight: true → crece dinámicamente.
# La banda siguiente "Despues..." aparece debajo del último contenido renderizado,
# no overlapeando.

name: WrapDemo
title: "Demo word wrap + auto-height"
fileName: "wrap-demo"

page:
  size: Letter
  margins: { all: 1.5cm }

styles:
  Default:
    fontFamily: Helvetica
    fontSize: 10
  Title:
    basedOn: Default
    fontSize: 18
    bold: true
  Section:
    basedOn: Default
    fontSize: 12
    bold: true
    foreground: "#0F172A"
  Caption:
    basedOn: Default
    fontSize: 9
    foreground: "#64748B"

bands:
  # Banda con AutoHeight=false (default) — height fija 50.
  - kind: ReportHeader
    height: 50
    elements:
      - type: text
        bounds: { x: 0, y: 0, width: 500, height: 26 }
        content: "Demo · word wrap + auto-height"
        style: Title
      - type: text
        bounds: { x: 0, y: 30, width: 500, height: 12 }
        content: "Cada caja angosta abajo se rompe con wrap; la banda crece sola."
        style: Caption

  # Banda Detail con AutoHeight=true — height: 0, crece según el contenido.
  - kind: Detail
    height: 0
    autoHeight: true
    elements:
      # Caja angosta con texto largo
      - type: rectangle
        bounds: { x: 0, y: 0, width: 200, height: 90 }
        fill: "#F8FAFC"
        borderLine: { thickness: 0.5, color: "#CBD5E1" }
      - type: text
        bounds: { x: 8, y: 8, width: 184, height: 80 }
        content: "{{ $.descripcion_larga }}"
        style: Default
        # auto-height del text element (toma todas las líneas necesarias)

      # Caja con \n explícitos
      - type: rectangle
        bounds: { x: 220, y: 0, width: 280, height: 90 }
        fill: "#F8FAFC"
        borderLine: { thickness: 0.5, color: "#CBD5E1" }
      - type: text
        bounds: { x: 228, y: 8, width: 264, height: 80 }
        content: "Linea 1: cabe perfecta\nLinea 2 mas extensa\nLinea 3: corta\nLinea 4 final"
        style: Default

  # Banda con AutoHeight=true y contenido corto — la banda usa height declarada (mínimo).
  - kind: Detail
    height: 30
    autoHeight: true
    elements:
      - type: text
        bounds: { x: 0, y: 8, width: 500, height: 14 }
        content: "✓ Esta sección es corta y respeta el height mínimo declarado (30pt)."
        style: Section

  # Banda Detail otra con texto largo + autoHeight para crecer
  - kind: Detail
    height: 0
    autoHeight: true
    elements:
      - type: rectangle
        bounds: { x: 0, y: 0, width: 500, height: 70 }
        fill: "#FEF3C7"
        borderLine: { thickness: 0.5, color: "#F59E0B" }
      - type: text
        bounds: { x: 8, y: 8, width: 484, height: 60 }
        content: "{{ $.observacion }}"
        style: Default

  # Banda final fija — debe aparecer SIEMPRE debajo del contenido anterior.
  - kind: ReportFooter
    height: 30
    elements:
      - type: line
        bounds: { x: 0, y: 0, width: 500, height: 0 }
        color: "#64748B"
        thickness: 0.5
      - type: text
        bounds: { x: 0, y: 8, width: 500, height: 14 }
        content: "Esta línea aparece debajo del contenido anterior, sin overlap."
        style: Caption
